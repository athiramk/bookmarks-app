name: Build

on:
  push:
    paths:
      - "bookmark-api/**"
    branches: [ "**" ]
#  pull_request:
#    paths:
#      - "bookmark-api/**"
#    types:
#      - opened
#      - synchronize
#      - reopened

jobs:
  build-bookmark-api:
    name: Build bookmark-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bookmark-api
    steps:

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -ntp verify

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Build and Publish Docker Image
        run: |
          docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=${{ vars.DOCKER_USERNAME }}/bookmark-api
          docker push ${{ vars.DOCKER_USERNAME }}/bookmark-api